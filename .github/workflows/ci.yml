name: CI

# Gate de calidad en PRs. Los jobs viven en `checks.yml` para que los deploys corran
# exactamente los mismos, sin copiarlos: ver la cabecera de ese archivo.

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
