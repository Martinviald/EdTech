name: CI

# Gate de calidad en PRs. Los jobs viven en `checks.yml`; ver su cabecera para la
# relación con la branch protection de `main` y por qué los deploys no los repiten.

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
