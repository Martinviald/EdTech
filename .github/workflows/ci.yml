name: CI

# Gate de calidad en PRs: typecheck + lint + guard del Design System + `next build`.
# (El repo antes solo tenía workflows de deploy; nada bloqueaba un PR roto.)
#
# `next build` es el ÚNICO paso que detecta violaciones de frontera cliente/servidor
# (RSC): un módulo que usa hooks (useState/useRef) sin `'use client'` pasa typecheck y
# lint pero rompe la build de producción. Sin este paso esos errores llegaban al deploy.
#
# El job `db` corre los tests de `packages/db`. Entre ellos está el test de CIERRE del
# read-model de cohorte (R1), que es la mitad auditable del gate del backfill: si el
# grafo de imports del recálculo se ensancha y la huella deja de cubrirlo, esto se pone
# en rojo acá en vez de dejar la analítica vieja en silencio en el próximo deploy.
# Ver docs/plan-optimizar-backfill-cohort-stats.md §2.3.
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web (typecheck · lint · design-system)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # apps/web resuelve @soe/types y @soe/db (transpilePackages en next.config);
      # se construyen para que typecheck y `next build` los encuentren. Mismo par
      # que arma el deploy del front antes de `next build` (deploy-frontend.yml).
      - name: Build workspace deps
        run: pnpm --filter @soe/types build && pnpm --filter @soe/db build

      - name: Typecheck
        run: pnpm --filter @soe/web typecheck

      - name: Lint
        run: pnpm --filter @soe/web lint

      - name: Design System guard
        run: pnpm --filter @soe/web lint:ds

      # Build de producción: detecta errores que typecheck/lint NO ven —sobre todo
      # violaciones de frontera cliente/servidor (RSC). Corre en checkout limpio sin
      # `.env`, igual que el `next build` del deploy (que compila sin esas variables).
      - name: Production build (next build)
        run: pnpm --filter @soe/web build

  db:
    name: DB (typecheck · tests · gate del read-model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # packages/db importa tipos de @soe/types (schemas con .$type<T>()).
      - name: Build workspace deps
        run: pnpm --filter @soe/types build

      - name: Typecheck
        run: pnpm --filter @soe/db typecheck

      # No tocan la BDD: son puros (pool de workers, holder de conexión, huella del
      # cierre de imports). Corren en cualquier runner sin Postgres.
      - name: Tests
        run: pnpm --filter @soe/db test

  types:
    name: Types (typecheck · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @soe/types typecheck

      # Los schemas Zod y las utilidades puras (calculadores, parsers) se validan acá.
      # No tocan la BDD ni la red: corren en cualquier runner.
      #
      # No se agrega un job para `@soe/api`: su suite necesita un Postgres con seed y los
      # secretos de sesión, que el runner no tiene. Correrla sin eso da rojo por entorno,
      # no por el código — ruido que termina enseñando a ignorar el CI.
      - name: Tests
        run: pnpm --filter @soe/types test
