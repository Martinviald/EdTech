name: Deploy Backend (migrate + backfill → ECR → App Runner)

# Push a main que toca el backend → (1) migra el RDS y, SI HACE FALTA, repuebla el
# read-model de cohorte, (2) rebuildea la imagen y la pushea a ECR. App Runner
# (autoDeploymentsEnabled) redeploya al detectar :latest nuevo.
#
# GATE DEL BACKFILL. El backfill completo costaba ~10 de los ~11 minutos del job y sólo
# hace falta cuando cambió la semántica del recálculo o hubo una migración nueva.
# `db:cohort-stamp check` decide comparando la huella del código (cierre de imports) y la
# última migración aplicada contra lo estampado en `read_model_stamps`; ante cualquier
# duda responde que sí. El `verify` corre SIEMPRE, corra o no el backfill, y falla el
# deploy si el read-model quedó en blanco — es lo que reemplaza la garantía que antes
# daba correr el backfill en cada push.
# Ver docs/plan-optimizar-backfill-cohort-stats.md.
#
# La migración corre ANTES del build/push y lo GATEA (needs: migrate): las migraciones
# son ADITIVAS, así que el código viejo que sigue corriendo no se rompe, y cuando App
# Runner levanta la imagen nueva la BDD ya está a la par. Esto evita el bug de
# "column ... does not exist" cuando un deploy agrega columnas y el RDS no se migró.
#
# Requiere el secret de GitHub DB_MASTER_PASSWORD (= SST secret DbMasterPassword, stage demo).
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/db/**"
      - "packages/types/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-backend.yml"
      - ".github/actions/rds-tunnel/**"
  workflow_dispatch:
    inputs:
      force_backfill:
        description: "Correr el backfill de cohort-stats aunque el gate diga que no hace falta"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Grupo COMPARTIDO con el deploy del front: ambos tocan el mismo estado de SST /
# App Runner, así que se serializan entre sí (nunca corren a la vez). Evita tanto
# el lock de estado de SST como el "OPERATION_IN_PROGRESS" de App Runner cuando el
# push de imagen del backend y el `sst deploy` del front se pisan.
concurrency:
  group: sst-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STAGE: demo
  ECR_REPOSITORY: edtech-api-demo # = aws.ecr.Repository name en sst.config.ts (stage demo)
  # Evaluaciones en paralelo dentro del backfill. El trabajo está dominado por la
  # latencia (runner en Azure, RDS en us-east-1, por el túnel SSM), no por CPU ni por el
  # RDS. Medido: la curva aplana en 6 y no aparecen reintentos transitorios.
  # Ver docs/plan-optimizar-backfill-cohort-stats.md §3 (Etapa C).
  BACKFILL_CONCURRENCY: "6"

jobs:
  # ── Migra el RDS privado ANTES de publicar la imagen nueva. ──
  # El RDS vive en la VPC; se llega por un port-forward SSM a través del bastión (la NAT
  # instance de SST, que está gestionada por SSM). No usa `sst tunnel` (evita sudo/TUN
  # en el runner). El script `db:migrate` corre drizzle + re-aplica rls-policies.sql.
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # versión desde packageManager (package.json), como deploy-frontend

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # El backfill (más abajo) importa el calculador puro de `@soe/types`, que se
      # consume como paquete compilado (`dist/`). `pnpm install` solo enlaza el
      # workspace; sin este build, `tsx src/scripts/backfill-cohort-stats.ts` falla con
      # "Cannot find module @soe/types/dist/index.js". migrate.ts NO importa @soe/types,
      # por eso el paso migrate sí funcionaba y el fallo aparecía recién en el backfill.
      - name: Build @soe/types (lo consume el backfill)
        run: pnpm --filter @soe/types build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # El túnel vive en una acción compuesta para que el backfill programado semanal
      # (.github/workflows/backfill-cohort-stats.yml) use exactamente el mismo camino.
      # Deja DATABASE_ADMIN_URL en el entorno del job.
      - name: Open RDS tunnel (SSM port-forward via bastion)
        uses: ./.github/actions/rds-tunnel
        with:
          stage: ${{ env.STAGE }}
          db-password: ${{ secrets.DB_MASTER_PASSWORD }}

      - name: Migrate RDS
        run: pnpm --filter @soe/db db:migrate

      # ── Read-model de cohorte ──
      # Los lectores de la imagen nueva (item-analysis, dashboards, heatmap,
      # official-reports) ya no derivan de `responses`: leen de acá. Si el read-model
      # quedara sin poblar, la analítica saldría en blanco (correctRate null, skills [],
      # heatmap []) sin ningún error visible.
      #
      # `check` decide; el backfill sólo corre si hace falta. El orden importa:
      #  · `set -euo pipefail` + `&&` ⇒ si el backfill falla, NO se estampa. La fila
      #    queda con la huella vieja y el próximo deploy lo reintenta: nunca queda
      #    marcado como hecho algo que no se hizo.
      #  · Todo va dentro del mismo túnel y ANTES de `build-and-push` (que depende de
      #    este job), así que cuando App Runner levanta la imagen nueva el read-model ya
      #    está al día.
      #  · El backfill es idempotente (delete+reinsert por assessment); correrlo de más
      #    es seguro. No recalcula assessment_results/skill_results, sólo los agrega.
      - name: Cohort read-model (gate + backfill si hace falta)
        env:
          FORCE_BACKFILL: ${{ inputs.force_backfill }}
        run: |
          set -euo pipefail

          FORCE_FLAG=""
          [ "${FORCE_BACKFILL:-false}" = "true" ] && FORCE_FLAG="--force"

          pnpm --filter @soe/db db:cohort-stamp check --out /tmp/run_backfill ${FORCE_FLAG}

          if [ "$(cat /tmp/run_backfill)" = "true" ]; then
            echo "::group::backfill de cohort-stats"
            pnpm --filter @soe/db db:backfill:cohort-stats \
              && pnpm --filter @soe/db db:cohort-stamp write
            echo "::endgroup::"
          else
            echo "read-model al día — se omite el backfill (≈10 min ahorrados)"
          fi

      # Corre SIEMPRE, haya backfill o no: si el read-model quedó en blanco, el deploy
      # falla acá en vez de publicar una imagen que muestra una analítica muda.
      - name: Verify cohort read-model (smoke check)
        run: pnpm --filter @soe/db db:cohort-stamp verify

  build-and-push:
    needs: migrate # el deploy no publica imagen nueva si la migración falló
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64 # arquitectura por defecto de App Runner
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
