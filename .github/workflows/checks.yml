name: Checks

# Los gates de calidad, en UN solo lugar. Los invoca `ci.yml` en cada PR.
#
# Los deploys (deploy.yml) NO los corren: la branch protection de `main` exige que estos
# jobs pasen en la PR y bloquea el push directo (también a admins), así que todo lo que
# llega a `main` ya pasó por acá. Antes cada workflow de deploy los repetía y un merge
# los corría hasta tres veces (~5 min por deploy).
#
# ⚠️ La protección exige los checks POR NOMBRE ("checks / Web (typecheck · …)"). Si se
# renombra o se agrega un job acá, hay que actualizar la lista de required checks de
# `main` (Settings → Branches) o la PR queda esperando un check que no existe.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Web (typecheck · lint · design-system)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # apps/web resuelve @soe/types y @soe/db (transpilePackages en next.config);
      # se construyen para que typecheck y `next build` los encuentren. Mismo par
      # que arma el deploy del front antes de `next build` (job `frontend` de deploy.yml).
      - name: Build workspace deps
        run: pnpm --filter @soe/types build && pnpm --filter @soe/db build

      - name: Typecheck
        run: pnpm --filter @soe/web typecheck

      - name: Lint
        run: pnpm --filter @soe/web lint

      - name: Design System guard
        run: pnpm --filter @soe/web lint:ds

      - name: Tests
        run: pnpm --filter @soe/web exec jest --ci --runInBand

      # Build de producción: detecta errores que typecheck/lint NO ven —sobre todo
      # violaciones de frontera cliente/servidor (RSC). Corre en checkout limpio sin
      # `.env`, igual que el `next build` del deploy (que compila sin esas variables).
      - name: Production build (next build)
        run: pnpm --filter @soe/web build

  db:
    name: DB (typecheck · tests · gate del read-model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # packages/db importa tipos de @soe/types (schemas con .$type<T>()).
      - name: Build workspace deps
        run: pnpm --filter @soe/types build

      - name: Typecheck
        run: pnpm --filter @soe/db typecheck

      # No tocan la BDD: son puros (pool de workers, holder de conexión, huella del
      # cierre de imports). Corren en cualquier runner sin Postgres.
      - name: Tests
        run: pnpm --filter @soe/db test


  types:
    name: Types (typecheck · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @soe/types typecheck

      # Los schemas Zod y las utilidades puras (calculadores, parsers) se validan acá.
      # No tocan la BDD ni la red: corren en cualquier runner.
      - name: Tests
        run: pnpm --filter @soe/types test

  decisions:
    name: Decisions (typecheck · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @soe/decisions typecheck

      # Tests puros: no llaman a Jev ni necesitan TYPESAFE_API_KEY en el runner.
      - name: Tests
        run: pnpm --filter @soe/decisions test

  api:
    name: API (typecheck · lint · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # apps/api importa @soe/types, @soe/db y @soe/decisions por su `dist`; sin
      # estos builds el typecheck no resuelve los paquetes del workspace.
      - name: Build workspace deps
        run: pnpm --filter @soe/types build && pnpm --filter @soe/db build && pnpm --filter @soe/decisions build

      - name: Typecheck
        run: pnpm --filter @soe/api typecheck

      - name: Lint
        run: pnpm --filter @soe/api lint

      # Los tests de la API viven acá y no en local: la suite levanta un worker de
      # jest por core y no entra en una máquina de 8 GB.
      #
      # src/privacy/ queda fuera: sus specs escriben contra una BDD con seed
      # (`db.update(students)`) y el runner no tiene Postgres. Ya fallaban antes de
      # existir este job; incluirlas lo dejaría en rojo permanente y el gate no
      # serviría para nada. Se reincorporan cuando el CI levante un Postgres.
      - name: Tests
        run: pnpm --filter @soe/api exec jest --ci --runInBand --testPathIgnorePatterns "src/privacy/"

  # El único gate que no es de Node. El lector de marcas es un servicio Python
  # independiente (sin BDD, sin tenants: una función pura sobre imagen + LayoutSpec) y
  # hasta acá no lo cubría NINGÚN check: se desplegaba a producción sin que corriera una
  # sola de sus pruebas, teniendo el detector calibrado contra umbrales que un cambio
  # silencioso rompe sin que nada lo note.
  omr:
    name: OMR (lint · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/omr
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/omr/requirements-dev.txt

      # requirements-dev.txt instala el LOCK, no requirements.txt: el conjunto de oro y
      # las calibraciones tienen que correr contra las mismas versiones que la imagen,
      # transitivas incluidas (ver la cabecera de esos archivos).
      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # `pytest` sin argumentos: `testpaths` del pyproject ya apunta a tests/ y goldset/.
      # El goldset corre sobre su hoja sintética de ejemplo, no sobre las 48 imágenes.
      - name: Tests
        run: pytest -q
